<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100-Question Python & Web Dev Practice Quiz</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #16a34a;
      --incorrect: #dc2626;
      --correct-bg: #f0fdf4;
      --incorrect-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      padding: 28px;
      align-self: center;
    }

    .header {
      margin-bottom: 20px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      text-align: left;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect-bg);
      border-color: var(--incorrect);
      color: var(--incorrect);
      font-weight: 600;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .primary-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .primary-btn:hover {
      background-color: var(--primary-hover);
    }

    .results-screen {
      text-align: center;
      padding: 20px 0;
    }

    .results-score {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin: 16px 0;
    }

    .results-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    .secondary-btn {
      background-color: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background-color: var(--bg);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Active Quiz View -->
    <div id="quiz-view">
      <div class="header">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="stats">
          <span id="question-counter">Question 1 of 100</span>
          <span id="score-counter">Score: 0</span>
        </div>
      </div>

      <div id="question-text" class="question-title">Loading...</div>
      <div id="options-container" class="options-grid"></div>

      <div class="controls">
        <button id="next-btn" class="primary-btn hidden" onclick="handleNextQuestion()">Next Question</button>
      </div>
    </div>

    <!-- Final Results View -->
    <div id="results-view" class="results-screen hidden">
      <h2>Quiz Complete!</h2>
      <div id="final-score" class="results-score">0%</div>
      <p id="results-summary" style="color: var(--text-muted);"></p>

      <div class="results-actions">
        <button id="retry-missed-btn" class="secondary-btn" onclick="retryMissedQuestions()">Retry Missed Questions</button>
        <button class="primary-btn" onclick="restartFullQuiz()">Restart Full Quiz</button>
      </div>
    </div>
  </div>

    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let missedQuestions = [];

    // Helper: Fisher-Yates shuffle algorithm
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Prepare questions by randomizing order and options
    function prepareQuestions(questionsList) {
      const shuffledQuestions = shuffleArray(questionsList);
      return shuffledQuestions.map(item => {
        const correctText = item.opts[item.ans];
        const shuffledOpts = shuffleArray(item.opts);
        const newAnsIndex = shuffledOpts.indexOf(correctText);
        return {
          q: item.q,
          opts: shuffledOpts,
          ans: newAnsIndex,
          originalRef: item
        };
      });
    }

    function startQuiz(questionsList) {
      activeQuestions = prepareQuestions(questionsList);
      currentIndex = 0;
      score = 0;
      missedQuestions = [];

      document.getElementById("quiz-view").classList.remove("hidden");
      document.getElementById("results-view").classList.add("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const currentQ = activeQuestions[currentIndex];
      
      // Update header/progress stats
      document.getElementById("progress-bar").style.width = `${((currentIndex) / activeQuestions.length) * 100}%`;
      document.getElementById("question-counter").innerText = `Question ${currentIndex + 1} of ${activeQuestions.length}`;
      document.getElementById("score-counter").innerText = `Score: ${score}`;
      document.getElementById("next-btn").classList.add("hidden");

      // Render question text
      document.getElementById("question-text").innerText = currentQ.q;

      // Render randomized options
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      const optionLabels = ["A", "B", "C", "D"];
      currentQ.opts.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<strong>${optionLabels[index]}.</strong>&nbsp; ${optText}`;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      const currentQ = activeQuestions[currentIndex];
      const buttons = document.querySelectorAll(".option-btn");

      // Disable all buttons once an option is selected
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === currentQ.ans) {
        buttons[selectedIndex].classList.add("correct");
        score++;
      } else {
        buttons[selectedIndex].classList.add("incorrect");
        buttons[currentQ.ans].classList.add("correct");
        missedQuestions.push(currentQ.originalRef);
      }

      document.getElementById("score-counter").innerText = `Score: ${score}`;
      
      // Show next button
      const nextBtn = document.getElementById("next-btn");
      if (currentIndex === activeQuestions.length - 1) {
        nextBtn.innerText = "View Results";
      } else {
        nextBtn.innerText = "Next Question";
      }
      nextBtn.classList.remove("hidden");
    }

    function handleNextQuestion() {
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quiz-view").classList.add("hidden");
      document.getElementById("results-view").classList.remove("hidden");

      const percentage = Math.round((score / activeQuestions.length) * 100);
      document.getElementById("final-score").innerText = `${percentage}%`;
      document.getElementById("results-summary").innerText = `You answered ${score} out of ${activeQuestions.length} questions correctly.`;

      const retryBtn = document.getElementById("retry-missed-btn");
      if (missedQuestions.length === 0) {
        retryBtn.classList.add("hidden");
      } else {
        retryBtn.classList.remove("hidden");
        retryBtn.innerText = `Retry ${missedQuestions.length} Missed Question${missedQuestions.length > 1 ? 's' : ''}`;
      }
    }

    function retryMissedQuestions() {
      startQuiz(missedQuestions);
    }

    function restartFullQuiz() {
      startQuiz(originalQuestions);
    }

    // Initialize quiz on page load
    window.onload = () => {
